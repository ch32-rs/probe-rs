# Flash blobs and memory maps generated by ch32-rs/flash-algorithms (algos/v4x7).
# Family name and WCH-Link detection are maintained manually.
name: CH32V4X7 Series
chip_detection:
- !WchLink
  # Revision is bits [7:4]; retain the low package nibble (VET=0, WEU=1, RET=2).
  mask: 0xffffff0f
  variants:
    0x46700000: CH32V407VET6
    0x46710001: CH32V407WEU6
    0x46720002: CH32V407RET6
    0x46730000: CH32V467VET6
    0x46740001: CH32V467WEU6
    0x46750002: CH32V467RET6
  # USER.RAM_CODE_MOD (bit 6), not the V3 three-bit split field.
  ob_code_ram_splits:
    0x46700000:
      address: 0x1ffff802
      mask: 0x40
      variants:
        0x0: CH32V407VET6
        0x40: CH32V407VET6_c576_r136
    0x46710001:
      address: 0x1ffff802
      mask: 0x40
      variants:
        0x0: CH32V407WEU6
        0x40: CH32V407WEU6_c576_r136
    0x46720002:
      address: 0x1ffff802
      mask: 0x40
      variants:
        0x0: CH32V407RET6
        0x40: CH32V407RET6_c576_r136
    0x46730000:
      address: 0x1ffff802
      mask: 0x40
      variants:
        0x0: CH32V467VET6
        0x40: CH32V467VET6_c576_r136
    0x46740001:
      address: 0x1ffff802
      mask: 0x40
      variants:
        0x0: CH32V467WEU6
        0x40: CH32V467WEU6_c576_r136
    0x46750002:
      address: 0x1ffff802
      mask: 0x40
      variants:
        0x0: CH32V467RET6
        0x40: CH32V467RET6_c576_r136
variants:
- name: CH32V407RET6
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: USR
    range:
      start: 0x8000000
      end: 0x80f8000
    cores:
    - main
    is_alias: false
    access:
      read: true
      write: true
      execute: true
  - !Nvm
    name: USR_LEGACY
    range:
      start: 0x0
      end: 0xf8000
    cores:
    - main
    is_alias: true
    access:
      read: true
      write: true
      execute: true
  - !Nvm
    name: SYS
    range:
      start: 0x1fff8000
      end: 0x1ffff000
    cores:
    - main
    is_alias: true
    access:
      read: true
      write: true
      execute: true
  - !Nvm
    name: VND
    range:
      start: 0x1ffff700
      end: 0x1ffff800
    cores:
    - main
    is_alias: true
    access:
      read: true
      write: false
      execute: false
  - !Nvm
    name: OPT
    range:
      start: 0x1ffff800
      end: 0x1ffff880
    cores:
    - main
    is_alias: true
    access:
      read: true
      write: true
      execute: false
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20032000
    cores:
    - main
    is_alias: false
    access:
      read: true
      write: true
      execute: true
  flash_algorithms:
  - ch32-v4x7-usr
  - ch32-v4x7-usr-legacy
  - ch32-v4x7-sys
  - ch32-v4x7-opt
