flash_algorithms:
- name: ch32-v4x7-opt
  description: ch32-v4x7-opt
  default: true
  instructions: 
  load_address: 0x20000020
  pc_init: 0x50
  pc_uninit: 0x12e
  pc_program_page: 0xb0
  pc_erase_sector: 0x4
  vendor_functions: {}
  data_section_offset: 0x15c
  rtt_poll_interval: 20
  flash_properties:
    address_range:
      start: 0x1ffff800
      end: 0x1ffff880
    page_size: 0x80
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x80
      address: 0x0
  big_endian: false
- name: ch32-v4x7-sys
  description: ch32-v4x7-sys
  default: true
  instructions: 
  load_address: 0x20000020
